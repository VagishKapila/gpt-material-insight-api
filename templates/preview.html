<!-- ✅ preview.html (Fixed Version) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preview Daily Log</title>
  <script>
    async function deleteImage(sessionId, imagePath) {
      const response = await fetch(`/remove_image/${sessionId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: imagePath })  // ✅ FIXED
      });
      if (response.ok) location.reload();
      else alert("❌ Failed to delete image.");
    }

    async function addImages(sessionId) {
      const input = document.getElementById("new_images");
      const files = input.files;
      const formData = new FormData();
      for (const file of files) formData.append("new_images", file);

      const response = await fetch(`/add_image/${sessionId}`, {
        method: "POST",
        body: formData
      });
      if (response.ok) location.reload();
      else alert("❌ Failed to upload image.");
    }
  </script>
</head>
<body>
  <h1>🧠 Preview Daily Log</h1>
  <form action="/submit_preview" method="post">
    <input type="hidden" name="session_id" value="{{ session_id }}">

    <h2>📸 Jobsite Photos</h2>
    <ul>
      {% for path in image_paths %}
        <li>
          <a href="/{{ path }}" target="_blank">
            <img src="/{{ path }}" width="150">
          </a><br>
          <button type="button" onclick="deleteImage('{{ session_id }}', '{{ path }}')">❌ Delete</button>
        </li>
      {% endfor %}
    </ul>

    <h3>Add More Photos:</h3>
    <input type="file" id="new_images" name="new_images" multiple accept="image/*" onchange="addImages('{{ session_id }}')">

    <h2>🔍 Scope Match Review</h2>
    {% set scored = ai_results.get("scored_items", []) %}
    {% for item in scored %}
      <input type="hidden" name="scope_{{ loop.index0 }}" value="{{ item.scope }}">
      Scope: <b>{{ item.scope }}</b><br>
      Match? <input type="checkbox" name="match_{{ loop.index0 }}" {% if item.match %}checked{% endif %}><br>
      Confidence: <input type="number" name="confidence_{{ loop.index0 }}" value="{{ item.confidence }}" min="0" max="100">%<br>
      Matched Image:
      <select name="matched_image_{{ loop.index0 }}">
        <option value="">None</option>
        {% for img in image_paths %}
          <option value="{{ img }}" {% if img == item.matched_image %}selected{% endif %}>{{ img.split('/')[-1] }}</option>
        {% endfor %}
      </select>
      <hr>
    {% endfor %}
    <input type="hidden" name="total_items" value="{{ scored | length }}">
    <button type="submit">✅ Generate PDF</button>
  </form>
</body>
</html>
