<!-- ✅ Updated form.html with working video previews and delete buttons -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Log Form</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script defer src="/static/uploader.js"></script>
  <style>
    .preview-thumb {
      width: 160px;
      height: 120px;
      object-fit: cover;
      border-radius: 5px;
      margin: 5px;
      position: relative;
    }
    .thumb-wrapper {
      display: inline-block;
      position: relative;
    }
    .delete-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      background: red;
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 14px;
      cursor: pointer;
      z-index: 2;
    }
    .play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      color: white;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛠️ Submit Daily Log</h1>
    <form action="/generate_form" method="POST" enctype="multipart/form-data">
      <!-- Other form fields -->

      <label>Jobsite Media (Images or Videos)</label>
      <div id="dropzone" class="dropzone">
        <p>📸 Drag & drop up to 20 files here, or click to select</p>
        <input type="file" id="fileInput" name="media_files" accept="image/*,video/*" multiple hidden>
      </div>
      <div id="preview-container"></div>

      <button type="submit">🚀 Generate Preview</button>
    </form>
  </div>

  <script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const previewContainer = document.getElementById("preview-container");

    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.style.borderColor = "#007bff";
    });
    dropzone.addEventListener("dragleave", () => {
      dropzone.style.borderColor = "#aaa";
    });
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.style.borderColor = "#aaa";
      handleFiles(e.dataTransfer.files);
      fileInput.files = e.dataTransfer.files; // Keep for submission
    });

    fileInput.addEventListener("change", () => {
      handleFiles(fileInput.files);
    });

    function handleFiles(files) {
      previewContainer.innerHTML = "";
      Array.from(files).forEach((file, idx) => {
        const ext = file.name.split(".").pop().toLowerCase();
        const reader = new FileReader();

        reader.onload = () => {
          const url = reader.result;
          const wrapper = document.createElement("div");
          wrapper.className = "thumb-wrapper";

          const delBtn = document.createElement("button");
          delBtn.className = "delete-btn";
          delBtn.innerHTML = "&times;";
          delBtn.onclick = () => wrapper.remove();

          if (["mp4", "mov", "webm"].includes(ext)) {
            wrapper.innerHTML += `
              <video class="preview-thumb" src="${url}" muted></video>
              <div class="play-overlay">▶</div>
            `;
          } else {
            wrapper.innerHTML += `<img src="${url}" class="preview-thumb">`;
          }

          wrapper.appendChild(delBtn);
          previewContainer.appendChild(wrapper);
        };
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
