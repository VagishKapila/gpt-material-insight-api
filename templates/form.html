<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Log Submission</title>
  <link rel="stylesheet" href="/static/style.css" /> <!-- ✅ Add uploader styling -->
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f8f9fa; }
    h1 { color: #2c3e50; }
    label { font-weight: bold; display: block; margin-top: 12px; }
    input[type="text"], input[type="date"], textarea, select {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; margin-top: 4px;
    }
    textarea { resize: vertical; }
    input[type="file"] { margin-top: 8px; }
    .checkbox { margin-top: 16px; }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #219150; }
    .form-section { background: #fff; padding: 20px; margin-bottom: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <h1>📋 Daily Log Entry</h1>
  <form action="/generate_form" method="post" enctype="multipart/form-data">
    
    <div class="form-section">
      <label>Project Name:</label>
      <input type="text" name="project_name" required>

      <label>Client Name:</label>
      <input type="text" name="client_name">

      <label>Location:</label>
      <input type="text" name="location" required>

      <label>Date:</label>
      <input type="date" name="date" value="{{ current_date if current_date else '' }}" required>

      <label>Weather:</label>
      <input type="text" name="weather" placeholder="Sunny, 75°F">
    </div>

    <div class="form-section">
      <label>Work Done:</label>
      <textarea name="work_done" rows="4" required></textarea>

      <label>Crew Notes:</label>
      <textarea name="crew_notes" rows="3"></textarea>

      <label>Safety Notes:</label>
      <textarea name="safety_notes" rows="3"></textarea>
    </div>

    <div class="form-section">
      <!-- 🧱 REPLACED OLD INPUT for jobsite images -->
      <label>Upload Job Site Photos (multiple):</label>

      <!-- ✅ NEW DRAG & DROP UPLOADER -->
      <div class="dropzone" id="dropzone">
        Drag & drop jobsite photos anywhere on this page or click below
        <input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>
      </div>

      <div id="preview-container"></div>

      <!-- Optional: Progress bar (same as uploader) -->
      <div id="progress-container" style="display:none; margin-top: 10px;">
        <div style="background: #ddd; border-radius: 8px; overflow: hidden;">
          <div id="progress-bar" style="width: 0%; height: 14px; background: #2ecc71;"></div>
        </div>
      </div>

      <div id="upload-status" style="margin-top: 10px; color: green;"></div>
      <!-- 🧱 END NEW UPLOADER -->

      <label>Upload Scope of Work File:</label>
      <input type="file" name="scope_doc" accept=".pdf,.docx,.txt,.xls,.xlsx">

      <label>Upload Safety Sheet (Image or PDF):</label>
      <input type="file" name="safety_sheet" accept=".jpg,.jpeg,.png,.pdf">

      <label>Upload Company Logo (optional):</label>
      <input type="file" name="logo" accept=".jpg,.jpeg,.png,.svg">

      <div class="checkbox">
        <label>
          <input type="checkbox" name="enable_ai" checked> ✅ Enable AI Scope Comparison
        </label>
      </div>
    </div>

    <button type="submit">🚀 Submit Daily Log</button>
  </form>

  <!-- ✅ Zoom modal for image/video preview -->
  <div id="zoom-modal" class="zoom-modal"></div>

  <!-- ✅ JS logic for uploader -->
  <script src="/static/uploader.js"></script>
</body>
</html>
