<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Log Form</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
        h1 { font-size: 26px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="text"], textarea, input[type="file"], select {
            width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px;
        }
        .form-section {
            background: white; padding: 20px; margin-bottom: 20px;
            border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .submit-button {
            display: inline-block; padding: 12px 24px; background-color: #007bff; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-size: 16px;
        }
        .submit-button:hover { background-color: #0056b3; }

        .skip-link {
            display: inline-block; margin-left: 20px; font-size: 14px;
            text-decoration: underline; color: #666; cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🛠️ Daily Log Entry</h1>

    <form action="/generate_form" method="POST" enctype="multipart/form-data">
        <div class="form-section">
            <label>Project Name</label>
            <input type="text" name="project_name" required>

            <label>Client Name</label>
            <input type="text" name="client_name">

            <label>Location</label>
            <input type="text" name="location" required>

            <label>Date</label>
            <input type="text" name="date" placeholder="YYYY-MM-DD" required>

            <label>Weather</label>
            <input type="text" name="weather" placeholder="Sunny, Rainy, etc.">
        </div>

        <div class="form-section">
            <label>Work Done</label>
            <textarea name="work_done" rows="4" required></textarea>

            <label>Crew Notes</label>
            <textarea name="crew_notes" rows="3"></textarea>

            <label>Safety Notes</label>
            <textarea name="safety_notes" rows="3"></textarea>
        </div>

        <div class="form-section">
            <label>Scope of Work File (.pdf, .docx, .txt)</label>
            <input type="file" name="scope_doc">

            <label>Upload Photos</label>
            <input type="file" name="images" multiple accept="image/*">

            <label>Logo Image (optional)</label>
            <input type="file" name="logo" accept="image/*">

            <label>Safety Sheet (PDF or Image)</label>
            <input type="file" name="safety_sheet" accept=".pdf,image/*">

            <label><input type="checkbox" name="enable_ai" checked> Enable AI Scope Comparison</label>
        </div>

        <button class="submit-button" type="submit">🔍 Preview Log</button>
        <a class="skip-link" href="/generate_skip">Skip Preview & Generate PDF →</a>
    </form>

</body>
</html>
