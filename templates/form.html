<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Log Form</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script defer src="/static/uploader.js"></script>
</head>
<body>
  <div class="container">
    <h1>📋 Daily Log Form</h1>

    <form action="/generate_form" method="post" enctype="multipart/form-data">
      <label>Project Name</label>
      <input type="text" name="project_name" placeholder="e.g. Upper Oaks Redevelopment" required />

      <label>Client Name</label>
      <input type="text" name="client_name" placeholder="e.g. Acme Corp" required />

      <label>Location</label>
      <input type="text" name="location" placeholder="e.g. San Rafael, CA" required />

      <label>Date</label>
      <input type="date" name="date" value="{{ datetime.now().strftime('%Y-%m-%d') }}" required />

      <label>Weather</label>
      <input type="text" name="weather" placeholder="e.g. Sunny, 75°F" />

      <label>Work Done Today</label>
      <textarea name="work_done" rows="3" placeholder="e.g. Excavated trench, poured concrete base"></textarea>

      <label>Crew Notes</label>
      <textarea name="crew_notes" rows="3" placeholder="e.g. 4 crew members onsite, no incidents"></textarea>

      <label>Safety Notes</label>
      <textarea name="safety_notes" rows="3" placeholder="e.g. All PPE observed, safety checklist completed"></textarea>

      <label>Upload Logo (optional)</label>
      <input type="file" name="logo" accept="image/*" />

      <label>Upload Safety Sheet (optional)</label>
      <input type="file" name="safety_sheet" accept="image/*,application/pdf" />

      <label>Upload Scope of Work</label>
      <input type="file" name="scope_doc" accept=".pdf,.docx,.xlsx,.txt" required />

      <label>Jobsite Media (Images or Videos)</label>
      <div id="dropzone" class="dropzone">
        <p>📸 Drag & drop up to 20 media files here (images/videos)<br>or click to select</p>
        <input type="file" id="fileInput" multiple hidden />
        <div id="preview-container"></div>
        <div id="progress-container">
          <div id="progress-bar"></div>
          <p id="upload-status"></p>
        </div>
        <div id="zoom-modal"></div>
      </div>

      <label>
        <input type="checkbox" name="enable_ai" checked /> Enable AI Scope Comparison (recommended)
      </label>

      <button type="submit">🚀 Generate Preview</button>
    </form>
  </div>
</body>
</html>
