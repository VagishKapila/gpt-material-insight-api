<!DOCTYPE html>
<html>
<head>
  <title>Daily Log Submission</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      color: #222;
      padding: 40px;
    }

    h1 {
      color: #0057a5;
      text-align: center;
    }

    form {
      max-width: 700px;
      margin: 0 auto;
      padding: 30px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    input[type="text"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    input[type="file"] {
      margin-top: 5px;
    }

    small {
      color: #555;
      display: block;
      margin-top: 3px;
      margin-bottom: 10px;
    }

    button, input[type="submit"] {
      background-color: #0057a5;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }

    button:hover, input[type="submit"]:hover {
      background-color: #0070d1;
    }

    p {
      text-align: center;
    }

    a {
      color: #0070d1;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Daily Log Submission Form</h1>

  <form action="/generate_form" method="post" enctype="multipart/form-data">
    <label>Project Name:</label>
    <input type="text" name="project_name" required><br>

    <label>Client Name:</label>
    <input type="text" name="client_name" required><br>

    <label>Location:</label>
    <input type="text" name="location" required><br>

    <label>Date:</label>
    <input type="date" name="date" required><br>

    <label>Weather:</label>
    <input type="text" name="weather"><br>

    <label>Work Done:</label>
    <textarea name="work_done" rows="6" required></textarea><br>

    <label>Safety Notes:</label>
    <textarea name="safety_notes" rows="4"></textarea><br>

    <label>Upload Scope of Work (PDF, DOCX, TXT, etc.):</label>
    <input type="file" name="scope_doc" accept=".pdf,.doc,.docx,.xlsx,.xls,.ppt,.pptx,.txt">
    <small>Accepted formats: PDF, DOCX, TXT, etc. Upload your full scope document.</small>

    <label>Upload Logo (Optional):</label>
    <input type="file" name="logo" accept=".png, .jpg, .jpeg">
    <small>Recommended size: under 5MB.</small>

    <label>Upload Safety Sheet (Image or PDF):</label>
    <input type="file" name="safety_sheet" accept=".pdf,.png,.jpg,.jpeg">
    <small>Accepted formats: PDF or image. Max 10MB.</small>

    <label>Upload Site Photos (Multiple Allowed):</label>
    <input type="file" name="images" multiple accept=".png, .jpg, .jpeg">
    <small>Multiple images allowed. Max 10MB per file.</small>

    <label>Enable AI Analysis:</label>
    <input type="checkbox" name="enable_ai" checked><br>

    <input type="submit" value="Generate PDF">
  </form>

  <p style="margin-top: 30px;">
    Prefer a drag-and-drop uploader?  
    <a href="/upload_ui"><b>Try the React Upload Tool</b> 🔄</a>
  </p>
</body>
</html>
