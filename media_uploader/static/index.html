<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test Media Upload (Image + Video)</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h2>📦 Test Media Upload (Image + Video)</h2>

    <div class="dropzone" id="dropzone">
      <p>Drag & drop files anywhere on this page or use the + Add button</p>
    </div>

    <div class="add-files-btn">
      <div>
        <button id="add-more-btn">+ Add More Files</button>
        <small>Supports .jpg, .png, .mp4, .mov, etc.</small>
      </div>
    </div>

    <div id="preview-container"></div>

    <button class="upload-btn" onclick="uploadMedia()">⬆️ Upload Media to Server</button>

    <div id="progress-container" style="display:none; margin-top: 20px;">
      <div style="font-size:14px; margin-bottom: 4px;">Upload Progress:</div>
      <div style="background: #ddd; border-radius: 8px; overflow: hidden;">
        <div id="progress-bar" style="width: 0%; height: 16px; background: #2ecc71;"></div>
      </div>
    </div>

    <div id="upload-status"></div>
  </div>

  <input type="file" id="fileInput" accept="image/*,video/*" multiple hidden />

  <div id="zoom-modal" class="zoom-modal" onclick="this.style.display='none'"></div>

  <script src="/static/uploader.js"></script>
</body>
</html>
