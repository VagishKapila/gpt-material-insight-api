<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Media Upload Test</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <h2>📦 Test Media Upload (Image + Video)</h2>

  <!-- Drag/drop zone + PLUS icon -->
  <div class="top-actions">
    <div class="add-more-label">+ Add More Files</div>
    <div class="dropzone" id="dropzone">
      Drag & drop or click to upload (Max 20 files, image ≤15 MB, video ≤100 MB)
      <input type="file" id="fileInput" accept="image/*,video/*" multiple hidden />
    </div>
  </div>

  <div class="preview-grid" id="previewGrid"></div>

  <button onclick="uploadMedia()" class="upload-btn">⬆️ Upload Media to Server</button>

  <div id="progress-container" style="display:none; margin-top: 20px;">
    <div style="font-size:14px; margin-bottom: 4px;">Upload Progress:</div>
    <div style="background: #ddd; border-radius: 8px; overflow: hidden;">
      <div id="progress-bar" style="width: 0%; height: 16px; background: #2ecc71;"></div>
    </div>
  </div>

  <div id="upload-status" style="margin-top: 15px; color: green;"></div>

  <!-- Zoom Preview Modal -->
  <div id="zoomModal" class="zoom-modal" onclick="closeZoom()">
    <span class="close-btn">&times;</span>
    <img id="zoomImage" />
    <video id="zoomVideo" controls autoplay></video>
  </div>

  <script src="/static/uploader.js"></script>
</body>
</html>
